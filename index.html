<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-fadey.png" />
    <meta name="theme-color" content="#041018" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          history.scrollRestoration = "manual";
        } catch (e) {}
        var path = location.pathname || "/";
        if (path === "/" || path === "/index.html") {
          document.documentElement.setAttribute("data-landing-scroll", "pending");
          if (location.hash && location.hash !== "#inicio") {
            history.replaceState(null, "", path + location.search);
          }
          window.scrollTo(0, 0);
        }
      })();
    </script>
    <meta
      name="description"
      content="Fadey Solutions S.A.C. — Resto Fadey, ERP Fadey, desarrollo web y soporte. Tecnología que impulsa tu negocio."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Fadey Solutions S.A.C. | Tecnología que impulsa tu negocio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
