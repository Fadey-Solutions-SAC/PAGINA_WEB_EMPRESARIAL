# Como Resto FADEY: un Disk + SQLite. Sin PostgreSQL.
services:
  - type: web
    name: fadey-api
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run start:prod
    disk:
      name: fadey-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/fadey.db
      - key: DATABASE_URL
        value: file:/data/fadey.db
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: API_INGEST_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://fadeysolutions.pe,https://www.fadeysolutions.pe,http://localhost:5173
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
